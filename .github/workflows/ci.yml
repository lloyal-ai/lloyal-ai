# Deliberately smaller than the monorepo's. There is no `gpu-tests` job here:
# this package has no native surface, and in the monorepo every CLI PR either
# waited up to 30 minutes for a CUDA run on another repo or needed a
# `skip-gpu-tests` label. There is no `docs.yml` either — typedoc never
# included this package.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      # The templates are shipped as DATA, and `files` is what keeps them in the
      # tarball. Assert the count so a stray ignore rule or a `files` edit can't
      # silently publish a CLI that scaffolds an incomplete project.
      - name: Verify templates ship
        run: |
          COUNT=$(npm pack --dry-run --json | node -e "
            const p=JSON.parse(require('fs').readFileSync(0,'utf8'))[0];
            console.log(p.files.filter(f=>f.path.startsWith('templates/')).length);
          ")
          echo "template files in tarball: $COUNT"
          test "$COUNT" -eq 113

  # The front door, on every platform a developer actually uses.
  #
  # `spawn EINVAL` on Windows reached a user because nothing here ever ran the
  # CLI outside Linux. The failing call needs no model, no GPU and no network —
  # it is `spawn('npm')`, which Node refuses for a `.cmd` without a shell since
  # CVE-2024-27980. A free standard runner catches it.
  front-door:
    name: Scaffold (${{ matrix.os }} · ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        mode: [flags, wizard]
        exclude:
          # The wizard needs a pty to drive Ink. `script` provides one on POSIX;
          # Windows has no equivalent without a native pty dependency, so the
          # interactive path there is still verified by hand. Stated, not hidden.
          - os: windows-latest
            mode: wizard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build

      # Non-interactive: every answer supplied as a flag.
      - name: Scaffold via flags
        if: matrix.mode == 'flags'
        run: node bin/run.js new smoke --yes --targets cli,desktop,web --template basic

      # Interactive: the wizard renders, and the pty feeds it newlines to accept
      # each default. This is the path the reported crash actually came through —
      # post-scaffold runs inside an Ink effect.
      - name: Scaffold via wizard (pty)
        if: matrix.mode == 'wizard'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            script -q /dev/null node bin/run.js new smoke < <(printf '\n\n\n\n\n') || true
          else
            script -qec "node bin/run.js new smoke" /dev/null < <(printf '\n\n\n\n\n') || true
          fi

      # The assertion is the same either way: a project that typechecks.
      - name: The scaffold must build
        shell: bash
        run: |
          test -d smoke || { echo "no project scaffolded"; exit 1; }
          cd smoke
          test -d node_modules || npm install
          npx tsc --noEmit

      # tsc CANNOT see this class of bug. It does not resolve `.css` (or any
      # asset) imports — those are Vite's job — so a scaffold missing a
      # stylesheet typechecks cleanly and dies the moment a browser target
      # starts. That shipped: App.tsx imported ./ability.css against a file
      # named app.css, and `tsc --noEmit` was green throughout.
      #
      # `build:web` resolves every import without a server or a model.
      - name: The web target must resolve its imports
        if: matrix.mode == 'flags'
        shell: bash
        run: |
          cd smoke
          npx vite build --config targets/web/vite.web.config.ts

      # Bundles main, preload and renderer. No window, no display — the binary
      # fetch is handled by the template's own ensure-electron.js, which exists
      # because Electron 42 dropped its postinstall hook.
      - name: The desktop target must bundle
        if: matrix.mode == 'flags'
        shell: bash
        run: |
          cd smoke
          npm run build:desktop

      # `lloyal install` spawns npm too, and was equally dead on Windows. The
      # scaffold above proves `new`; this proves the second command a developer
      # runs. Both go through spawnNpm, and neither was covered before.
      - name: Install an ability into the scaffold
        if: matrix.mode == 'flags'
        shell: bash
        run: |
          cd smoke
          node ../bin/run.js install lloyal/web
          npx tsc --noEmit

  # `lloyal publish` needs a registered publisher, so CI cannot run it end to end
  # — which is exactly how a broken `npm pack` shipped in the PR that fixed the
  # other two call sites: the import landed, the call site did not, and no test
  # anywhere executed publish. This costs a second and fails loudly on that.
  no-raw-npm-spawn:
    name: No raw npm spawn outside npm-spawn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-npm-spawn.mjs
