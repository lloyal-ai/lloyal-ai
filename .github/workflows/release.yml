# Single package, so no publish loop — but the `npm view` guard is kept: it makes
# a re-run after a partial failure safe, which is exactly what saved the
# channel-verify release in lloyal-ai/hdk.
#
# NOTE ON FIRST PUBLISH: npm's 2026-07-31 change requires an interactive 2FA
# challenge to CREATE a package, so this workflow CANNOT publish a brand-new
# name — it will fail with a misleading E404. `lloyal@0.11.0` must be published
# once by hand (`npm publish`); every version after that runs from here.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      skip_publish:
        type: boolean
        default: true
      runner:
        description: 'Runner label. self-hosted when hosted minutes are unavailable.'
        type: string
        default: 'ubuntu-latest'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    # `inputs` is null on the tag-push trigger, so the fallback is what keeps a
    # release tag on hosted runners. An empty label queues forever, silently.
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      - name: Verify tarball contents
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const p=JSON.parse(require('fs').readFileSync('/tmp/pack.json','utf8'))[0];
            const f=p.files.map(x=>x.path);
            const need=['bin/run.js','LICENSE','package.json'];
            for (const n of need) if(!f.includes(n)) throw new Error('missing '+n);
            // Structure only — that the templates ship at all. The EXACT
            // count is ci.yml's pin, asserted on every PR; duplicating the
            // number here just drifts (it did: 98 vs the real 114).
            if (!f.some(x=>x.startsWith('templates/'))) throw new Error('no templates shipped');
            if (!f.some(x=>x.startsWith('dist/'))) throw new Error('no dist output');
            console.log('tarball ok:', f.length, 'files');
          "

      # The OIDC token is minted by the Actions service for the job — including
      # on a self-hosted runner. Unconditional, so a skip_publish rehearsal
      # proves the plumbing before a real cut depends on it. The request URL
      # only, never the token.
      - name: OIDC available?
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC token endpoint present - trusted publishing can authenticate."
          else
            echo "::warning::No OIDC token in this job, so trusted publishing cannot authenticate."
          fi

      - name: Publish
        if: success() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.skip_publish))
        run: |
          # Fail with a legible message rather than npm's ENEEDAUTH, which reads
          # like a broken token when the usual cause is that no auth is configured.
          # TWO valid auth paths, and this must accept either. Trusted publishing
          # (OIDC) needs no secret — the runner exchanges the job's id-token for a
          # short-lived credential, which is why this repository holds no NPM_TOKEN.
          # ACTIONS_ID_TOKEN_REQUEST_URL is set exactly when `id-token: write` is
          # granted, so it is the honest probe for "OIDC is available here".
          # Checking only the token would abort before the path that replaced it.
          if [ -z "${NODE_AUTH_TOKEN:-}" ] && [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No npm auth available. Configure trusted publishing on npmjs.com (preferred), or add NPM_TOKEN under" \
                 "Settings > Secrets and variables > Actions. The token needs the" \
                 "@lloyal-labs scope at read+write, and note that npm no longer lets" \
                 "CI CREATE a package name — only publish new versions of existing ones."
            exit 1
          fi

          # The tombstone goes FIRST. It is a one-shot publish that retires the
          # old name, and the `npm view` guard makes every later run skip it.
          #
          # Paths are written with a LEADING ./ deliberately. `npm publish <name>`
          # treats a bare word as a package SPEC, not a folder — `npm publish
          # tombstone` resolves and packs the `tombstone` package FROM THE
          # REGISTRY, i.e. someone else's code, under our account. Measured, not
          # theoretical. Never drop the ./.
          for pkg in ./tombstone .; do
            NAME=$(node -p "require('$pkg/package.json').name")
            VERSION=$(node -p "require('$pkg/package.json').version")
            # The dist-tag follows the version: -alpha.N publishes under the
            # alpha channel; `latest` only ever moves for a plain version.
            case "$VERSION" in
              *-alpha*) TAG=alpha ;;
              *-beta*)  TAG=beta ;;
              *-rc*)    TAG=rc ;;
              *)        TAG=latest ;;
            esac
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "skip $NAME@$VERSION - already published"
            else
              # A manual dispatch may only ever ship a prerelease. TAG falls
              # through to `latest` for any version without a suffix, so one
              # hand-edited manifest would otherwise move production. Releases
              # go out through a v* tag, which is not affected by this.
              if [ "$TAG" = "latest" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                echo "::error::$NAME@$VERSION would publish to latest. A manual dispatch may only ship a prerelease; production goes through a v* tag."
                exit 1
              fi
              echo "publishing $NAME@$VERSION from $pkg (tag: $TAG) ..."
              npm publish "$pkg" --access public --provenance --tag "$TAG"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
