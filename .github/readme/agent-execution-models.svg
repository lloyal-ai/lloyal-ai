<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title description">
  <title id="title">Shared context, independent agents</title>
  <desc id="description">Two storage layouts side by side. Lloyal agents reference one shared attention prefix and each keep a private continuation and recurrent state. LangGraph with llama-server uses a separate attention prefix in each slot in the measured configuration, with prefix-cache enabled. Recurrent-state blocks are equal on both sides. This is a schematic, not a memory scale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="#FF5A36" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1280" height="320" fill="#FFFFFF"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#20222A">
    <rect x="12" y="12" width="614" height="296" rx="12" fill="#FFFFFF" stroke="#D9DCE3"/>
    <rect x="654" y="12" width="614" height="296" rx="12" fill="#FFFFFF" stroke="#D9DCE3"/>
    <text x="32" y="46" font-size="25" font-weight="700">Lloyal</text>
    <text x="674" y="46" font-size="25" font-weight="700">LangGraph + llama-server</text>
    <text x="32" y="71" font-size="16" fill="#626976">Resident attention shared by concurrent agents</text>
    <text x="674" y="71" font-size="16" fill="#626976">Prefix-cache enabled · separate KV streams</text>

    <!-- Native: one prefix, with references to independent continuations. -->
    <rect x="32" y="93" width="574" height="40" rx="6" fill="#FFF3EE" stroke="#FF5A36" stroke-width="2"/>
    <text x="319" y="119" text-anchor="middle" font-size="20" fill="#AC381F">One shared attention prefix</text>
    <path d="M46 133 V269 H60 M46 186 H60" fill="none" stroke="#FF5A36" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M46 269 H60" fill="none" stroke="#FF5A36" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="62" y="163" width="544" height="46" rx="6" fill="#FFFFFF" stroke="#CBD0D9"/>
      <path d="M406 163 H600 Q606 163 606 169 V203 Q606 209 600 209 H406 Z" fill="#EBEDF1"/>
      <path d="M406 163 V209" stroke="#CBD0D9"/>
      <text x="78" y="193" font-size="19">Agent 1 · private continuation</text>
      <text x="506" y="193" text-anchor="middle" font-size="18" fill="#4D5563">Recurrent state</text>
    </g>
    <g>
      <rect x="62" y="246" width="544" height="46" rx="6" fill="#FFFFFF" stroke="#CBD0D9"/>
      <path d="M406 246 H600 Q606 246 606 252 V286 Q606 292 600 292 H406 Z" fill="#EBEDF1"/>
      <path d="M406 246 V292" stroke="#CBD0D9"/>
      <text x="78" y="276" font-size="19">Agent 2 · private continuation</text>
      <text x="506" y="276" text-anchor="middle" font-size="18" fill="#4D5563">Recurrent state</text>
    </g>

    <!-- HTTP: the measured separate-stream configuration reserves a prefix per slot. -->
    <g>
      <rect x="674" y="93" width="574" height="86" rx="6" fill="#FFFFFF" stroke="#CBD0D9"/>
      <rect x="674" y="93" width="574" height="40" rx="6" fill="#F0F3FF" stroke="#4361EE" stroke-width="2"/>
      <text x="961" y="119" text-anchor="middle" font-size="20" fill="#3148B5">Slot 1 · attention prefix</text>
      <path d="M1048 134 H1248 V173 Q1248 179 1242 179 H1048 Z" fill="#EBEDF1"/>
      <path d="M1048 134 V179" stroke="#CBD0D9"/>
      <text x="690" y="163" font-size="19">Agent 1 · private continuation</text>
      <text x="1148" y="163" text-anchor="middle" font-size="18" fill="#4D5563">Recurrent state</text>
    </g>
    <g>
      <rect x="674" y="206" width="574" height="86" rx="6" fill="#FFFFFF" stroke="#CBD0D9"/>
      <rect x="674" y="206" width="574" height="40" rx="6" fill="#F0F3FF" stroke="#4361EE" stroke-width="2"/>
      <text x="961" y="232" text-anchor="middle" font-size="20" fill="#3148B5">Slot 2 · attention prefix</text>
      <path d="M1048 247 H1248 V286 Q1248 292 1242 292 H1048 Z" fill="#EBEDF1"/>
      <path d="M1048 247 V292" stroke="#CBD0D9"/>
      <text x="690" y="276" font-size="19">Agent 2 · private continuation</text>
      <text x="1148" y="276" text-anchor="middle" font-size="18" fill="#4D5563">Recurrent state</text>
    </g>
  </g>
</svg>
