<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-labelledby="title description">
  <title id="title">HTTP + Prefix Caching</title>
  <desc id="description">LangGraph plus llama-server with prefix caching enabled. The measured configuration uses separate KV streams: slots 1, 2, through 128 each reserve an attention prefix, private continuation and recurrent state. The ellipsis represents slots 3 through 127. Recurrent-state blocks match the Lloyal panel. Shapes are not a memory scale.</desc>
  <rect width="640" height="460" fill="#FFFFFF"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#20222A">
    <rect x="12" y="12" width="616" height="436" rx="12" fill="#FFFFFF" stroke="#D9DCE3"/>
    <text x="32" y="48" font-size="27" font-weight="700">HTTP + Prefix Caching</text>
    <text x="32" y="75" font-size="16" fill="#626976">LangGraph + Llama Server + Prefix Caching enabled</text>

    <!-- The measured separate-stream configuration reserves a prefix per slot. -->
    <g>
      <rect x="32" y="102" width="576" height="88" rx="6" fill="#FFFFFF" stroke="#CBD0D9"/>
      <rect x="32" y="102" width="576" height="42" rx="6" fill="#F0F3FF" stroke="#4361EE" stroke-width="2"/>
      <text x="320" y="129" text-anchor="middle" font-size="20" fill="#3148B5">Slot 1 · attention prefix</text>
      <path d="M408 145 H608 V184 Q608 190 602 190 H408 Z" fill="#EBEDF1"/>
      <path d="M408 145 V190" stroke="#CBD0D9"/>
      <text x="46" y="174" font-size="18">Agent 1 · private continuation</text>
      <text x="508" y="174" text-anchor="middle" font-size="18" fill="#4D5563">Recurrent state</text>
    </g>
    <g>
      <rect x="32" y="214" width="576" height="88" rx="6" fill="#FFFFFF" stroke="#CBD0D9"/>
      <rect x="32" y="214" width="576" height="42" rx="6" fill="#F0F3FF" stroke="#4361EE" stroke-width="2"/>
      <text x="320" y="241" text-anchor="middle" font-size="20" fill="#3148B5">Slot 2 · attention prefix</text>
      <path d="M408 257 H608 V296 Q608 302 602 302 H408 Z" fill="#EBEDF1"/>
      <path d="M408 257 V302" stroke="#CBD0D9"/>
      <text x="46" y="286" font-size="18">Agent 2 · private continuation</text>
      <text x="508" y="286" text-anchor="middle" font-size="18" fill="#4D5563">Recurrent state</text>
    </g>
    <text x="320" y="332" text-anchor="middle" font-size="30" fill="#626976">⋮</text>
    <g>
      <rect x="32" y="340" width="576" height="88" rx="6" fill="#FFFFFF" stroke="#CBD0D9"/>
      <rect x="32" y="340" width="576" height="42" rx="6" fill="#F0F3FF" stroke="#4361EE" stroke-width="2"/>
      <text x="320" y="367" text-anchor="middle" font-size="20" fill="#3148B5">Slot 128 · attention prefix</text>
      <path d="M408 383 H608 V422 Q608 428 602 428 H408 Z" fill="#EBEDF1"/>
      <path d="M408 383 V428" stroke="#CBD0D9"/>
      <text x="46" y="412" font-size="18">Agent 128 · private continuation</text>
      <text x="508" y="412" text-anchor="middle" font-size="18" fill="#4D5563">Recurrent state</text>
    </g>
  </g>
</svg>
